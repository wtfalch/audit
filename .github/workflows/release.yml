name: Release

# A tag publishes, through npm trusted publishing (OIDC): the job's identity
# on this repository and this workflow is what npm trusts, so there is no
# token to hold, rotate or leak. Nothing here deploys anything. It runs the
# same gates CI runs, then hands the built package to npm with provenance,
# which ties the published tarball to this commit and this workflow.
#
# Two things trusted publishing needs, both here on purpose: `id-token: write`
# for the OIDC exchange, and an npm CLI new enough to perform it (11.5.1 or
# later), which Node 22's bundled npm 10 is not, hence the upgrade step. And
# one thing it must not have: a token. With NODE_AUTH_TOKEN set, npm uses the
# token and never asks for the OIDC identity; audit's first
# release runs failed with a 404 on PUT for exactly that reason, an org token
# that could not publish a package it was never scoped to.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # the OIDC exchange, and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: an npm that speaks trusted publishing
        run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The same check CI runs: the tarball is dist and nothing else. A
      # release is the one moment that matters, so it is asked here too.
      - name: the tarball holds dist and nothing else
        run: pnpm --filter @wtfalch/audit exec npm pack --dry-run
      # The tag is the version. A tag that disagrees with package.json is a
      # release of the wrong thing, and this is where it stops.
      - name: tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/audit/package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "tag v$TAG != package $PKG"; exit 1; }
      # `npm publish` directly rather than `pnpm publish`: the OIDC exchange
      # is the npm CLI's, and the upgraded npm above is the one on PATH.
      - name: publish
        working-directory: packages/audit
        run: npm publish --access public --provenance --ignore-scripts
