name: CI

# Publishing is release.yml, on a `v*` tag; this only checks.

# Pull requests only: a squash merge lands the tree the PR run already
# tested, so a second run on main repeated it. Run it on main by hand with
# workflow_dispatch.
on:
  pull_request:
  workflow_dispatch:

# A newer push to the same PR cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: the tarball holds dist and nothing else
        run: pnpm --filter @wtfalch/audit exec npm pack --dry-run
